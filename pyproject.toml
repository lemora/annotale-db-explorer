[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "annotale-db-explorer"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "altair==6.0.0",
    "edlib==1.3.9.post1",
    "pandas==2.3.3",
    "plotly==6.6.0",
    "streamlit==1.55.0",
    "streamlit-plotly-events==0.0.6",
]

[tool.setuptools]
py-modules = []
